[package]
name = "stryke-docker-helper"
version = "0.1.1"
edition = "2021"
description = "Docker bridge binary for the stryke `docker` package."
authors = ["MenkeTechnologies"]
license = "MIT"
repository = "https://github.com/MenkeTechnologies/stryke-docker"
homepage = "https://menketechnologies.github.io/stryke-docker/"
publish = false

[[bin]]
name = "stryke-docker-helper"
path = "src/main.rs"

[dependencies]
bollard = { version = "0.17", default-features = false, features = ["ssl"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "signal", "fs"] }
futures-util = "0.3"
clap = { version = "4", default-features = false, features = [
    "std", "derive", "help", "usage", "error-context", "env",
] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
anyhow = "1"
tar = "0.4"
flate2 = "1"
walkdir = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
